[project]
name = "locoagent"
version = "0.0.0"
description = "Maybe a coding agent"
requires-python= ">=3.10"

dependencies = [
    "openai",
    "pytest>=9.1.1",
    "python-dotenv",
]

[project.scripts]
locoagent = "locoagent.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
